<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Progreso - ZGDPS Demon List</title>
  <style>
    :root {
      --bg-color: #12131a;
      --card-bg: #1c1e29;
      --accent-color: #5865F2; /* Discord Blurple */
      --accent-hover: #4752C4;
      --green-color: #2ecc71;
      --text-color: #ffffff;
      --subtext-color: #a3a6b4;
      --border-color: #2f3242;
      --error-color: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--text-color);
      font-size: 1.4rem;
    }

    /* Sección de Verificación Discord */
    .oauth-box {
      background: #14151d;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .btn-discord {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
      width: 100%;
      justify-content: center;
    }

    .btn-discord:hover {
      background-color: var(--accent-hover);
    }

    .user-profile {
      display: none;
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    .user-profile img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--green-color);
    }

    .user-info p {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .user-info span {
      font-size: 0.8rem;
      color: var(--green-color);
    }

    /* Formulario */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.88rem;
      color: var(--subtext-color);
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #14151d;
      color: var(--text-color);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    input:disabled, select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-submit {
      background-color: var(--green-color);
      color: #fff;
      border: none;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 100x;
    }

    .btn-submit:disabled {
      background-color: #444;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    .status-msg.error {
      background-color: rgba(231, 76, 60, 0.2);
      color: var(--error-color);
      border: 1px solid var(--error-color);
    }

    .status-msg.success {
      background-color: rgba(46, 204, 113, 0.2);
      color: var(--green-color);
      border: 1px solid var(--green-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <h2> Enviar Progreso ZGDPS</h2>

    <!-- Paso 1: Autenticación Discord -->
    <div class="oauth-box">
      <button id="btn-login" class="btn-discord" onclick="iniciarOAuth2()">
        <svg width="20" height="15" viewBox="0 0 127.14 96.36" fill="#ffffff">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.93-72.13ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.92,53.87,53,48.8,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.08-12.74,11.44-12.74S96.2,45.92,96.07,53,91,65.69,84.69,65.69Z"/>
        </svg>
        iniciar con cuenta de discord
      </button>

      <div id="user-profile" class="user-profile">
        <img id="user-avatar" src="" alt="Avatar">
        <div class="user-info">
          <p id="user-name">Cargando...</p>
          <span>✓ Verificado con Discord</span>
        </div>
      </div>
    </div>

    <!-- Formulario de envío -->
    <form id="progress-form">
      <div class="form-group">
        <label for="user-gdps">Usuario GDPS</label>
        <input type="text" id="user-gdps" placeholder="Ejemplo: senkoGD" required disabled>
      </div>

      <div class="form-group">
        <label for="nivel">Escoge el nivel</label>
        <select id="nivel" required disabled>
          <option value="" disabled selected>-- Selecciona un nivel --</option>
          <!-- ⚙️ Puedes agregar/editar tus niveles aquí -->
          <option value="Acheron">Acheron</option>
          <option value="Bloodbath">Bloodbath</option>
          <option value="Cataclysm">Cataclysm</option>
          <option value="Sonic Wave">Sonic Wave</option>
          <option value="Slaughterhouse">Slaughterhouse</option>
        </select>
      </div>

      <div class="form-group">
        <label for="porcentaje">Porcentaje alcanzado</label>
        <input type="text" id="porcentaje" placeholder="Ejemplo: 100%" required disabled>
      </div>

      <div class="form-group">
        <label for="link-prueba">Enlace de prueba (YouTube / TikTok)</label>
        <input type="url" id="link-prueba" placeholder="https://youtu.be/..." required disabled>
      </div>

      <button type="submit" id="btn-submit" class="btn-submit" disabled>Enviar Progreso</button>
    </form>

    <div id="status-msg" class="status-msg"></div>
  </div>

  <script>
    // ⚙️ CONFIGURACIÓN PRINCIPAL
    const DISCORD_CLIENT_ID = "1551797809492271214";
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1558265129831891025/8mpOtLpqGtyd1808KTIhNXM0SJYlzkAXPUIPGNOhwjlKJUSpMG8JgyiNhUXLyk713YKI";
    
    // URI de redirección de OAuth2 (debe ser la misma URL donde se aloje o cargue el iframe)
    const REDIRECT_URI = "https://senkogd.github.io/Zen_gdps_Progress/"; window.location.href.split('#')[0];

    let discordUserData = null; // Guardará el ID e información del usuario autenticado

    // 1. Iniciar sesión mediante OAuth2 de Discord
    function iniciarOAuth2() {
      const authUrl = `https://discord.com/oauth2/authorize?client_id=${1551797809492271214}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
      
      // Abrir en ventana emergente para evitar salir de Google Sites
      const popup = window.open(authUrl, "DiscordOAuth2", "width=500,height=800");

      const checkToken = setInterval(() => {
        try {
          if (!popup || popup.closed) {
            clearInterval(checkToken);
          }
          if (popup.location.href.includes("access_token")) {
            const hash = popup.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const token = params.get("access_token");
            popup.close();
            clearInterval(checkToken);
            
            if (token) {
              obtenerUsuarioDiscord(token);
            }
          }
        } catch (e) {
          // Ignorar errores CORS hasta que redirija
        }
      }, 500);
    }

    // Comprobar si volvió de una redirección directa con token
    window.onload = () => {
      if (window.location.hash.includes("access_token")) {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const token = params.get("access_token");
        if (token) {
          obtenerUsuarioDiscord(token);
          // Limpiar el hash de la URL
          history.replaceState(null, null, ' ');
        }
      }
    };

    // 2. Obtener perfil de usuario desde la API de Discord
    async function obtenerUsuarioDiscord(token) {
      try {
        const response = await fetch("https://discord.com/api/v10/users/@me", {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (!response.ok) throw new Error("Error de conexión con Discord");

        discordUserData = await response.json();

        // Mostrar avatar y nombre
        document.getElementById("user-avatar").src = `https://cdn.discordapp.com/avatars/${discordUserData.id}/${discordUserData.avatar}.png`;
        document.getElementById("user-name").textContent = discordUserData.global_name || discordUserData.username;
        
        document.getElementById("btn-login").style.display = "none";
        document.getElementById("user-profile").style.display = "flex";

        // Habilitar campos del formulario
        habilitarFormulario(true);

      } catch (error) {
        mostrarMensaje("no se ha verificado o ubo un error de conección", true);
      }
    }

    // Habilitar / Deshabilitar inputs
    function habilitarFormulario(estado) {
      document.getElementById("user-gdps").disabled = !estado;
      document.getElementById("nivel").disabled = !estado;
      document.getElementById("porcentaje").disabled = !estado;
      document.getElementById("link-prueba").disabled = !estado;
      document.getElementById("btn-submit").disabled = !estado;
    }

    // 3. Envío al Webhook de Discord
    document.getElementById("progress-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      // Validación del estado de verificación OAuth2
      if (!discordUserData || !discordUserData.id) {
        mostrarMensaje("no se ha verificado o ubo un error de conección", true);
        return;
      }

      const userGdps = document.getElementById("user-gdps").value.trim();
      const nivel = document.getElementById("nivel").value;
      const porcentaje = document.getElementById("porcentaje").value.trim();
      const link = document.getElementById("link-prueba").value.trim();

      // Formato exacto de mensaje solicitado
      const mensajeContent = `¡<@${discordUserData.id}> ha mandado un nuevo progreso!\n\n${userGdps} llego al ${porcentaje} en el nivel ${nivel}.\n\nAquí están las pruebas \n${link}`;

      const payload = {
        content: mensajeContent
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          mostrarMensaje("¡Progreso enviado correctamente!", false);
          document.getElementById("progress-form").reset();
        } else {
          mostrarMensaje("no se ha verificado o ubo un error de conección", true);
        }
      } catch (err) {
        mostrarMensaje("no se ha verificado o ubo un error de conección", true);
      }
    });

    function mostrarMensaje(texto, esError) {
      const msgBox = document.getElementById("status-msg");
      msgBox.textContent = texto;
      msgBox.className = "status-msg " + (esError ? "error" : "success");
      msgBox.style.display = "block";
    }
  </script>
</body>
</html>
